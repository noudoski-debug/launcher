name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Проект ищется сам: в корне, в подпапке или внутри zip
      - name: Найти проект
        run: |
          SET=$(find . -maxdepth 3 -name settings.gradle.kts -not -path "./_src/*" | head -1)
          if [ -z "$SET" ]; then
            ZIP=$(ls -1 *.zip 2>/dev/null | head -1)
            if [ -n "$ZIP" ]; then
              mkdir -p _src && unzip -q -o "$ZIP" -d _src
              SET=$(find _src -name settings.gradle.kts | head -1)
            fi
          fi
          if [ -z "$SET" ]; then
            echo "Не найден settings.gradle.kts: загрузите проект в репозиторий"
            exit 1
          fi
          echo "ROOT=$(dirname "$SET")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Ключ берётся из секретов репозитория; если их нет, подпись отладочным ключом
      - name: Подготовить ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "Секрет KEYSTORE_BASE64 не задан, подпись отладочным ключом"
          fi

      - name: Собрать release
        working-directory: ${{ env.ROOT }}
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          cp "$ROOT"/app/build/outputs/apk/release/*.apk out/MaterialLauncher-release.apk
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="build-${{ github.run_number }}"; fi
          gh release create "$TAG" out/MaterialLauncher-release.apk \
            --title "Material Launcher, сборка $TAG" \
            --notes "Установите MaterialLauncher-release.apk. Список изменений: CHANGELOG.md"
